name: Deploy Cloudflare Pages

# Deploy manual. Butuh repo secrets di bawah + secrets runtime di project Pages
# (`npx wrangler pages secret put NAMA --project-name uprakict`).
# Jalur deploy harian tetap manual dari Windows — lihat README "Build & deploy".
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (next-on-pages)
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SEKOLAH_ID: ${{ secrets.NEXT_PUBLIC_SEKOLAH_ID }}
          NEXT_PUBLIC_SEKOLAH_NAMA: ${{ secrets.NEXT_PUBLIC_SEKOLAH_NAMA }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          UJIAN_TAHUN_AJARAN: ${{ secrets.UJIAN_TAHUN_AJARAN }}
          UJIAN_SEMESTER: ${{ secrets.UJIAN_SEMESTER }}
          UJIAN_NAMA: ${{ secrets.UJIAN_NAMA }}
          UJIAN_DESKRIPSI: ${{ secrets.UJIAN_DESKRIPSI }}
          UJIAN_TUTUP: ${{ secrets.UJIAN_TUTUP }}
          UJIAN_MAKS_MB: ${{ secrets.UJIAN_MAKS_MB }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=uprakict --branch=main
